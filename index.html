<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>To-do List</title>
</head>
<body>
    <section class="section-container">
        <div class="div-container">
            <div class="card">
               <div class="list-header">
                <h1 class="head">To-do List <img src="icon.jpg" alt="icon" width="25px" height="25px"></h1>
               </div>
                <div class="list-body">
                <div class="input-getter">
                <input type="text" placeholder="Add your task">
                <button type="submit">Add</button>
                </div>
                <div class="list">
                    <ul class="list-container">
                <!-- add list element here -->
                    </ul>
                </div>
                </div>
            </div>
        </div>
    </section>
    <script>
        const inputVariable=document.querySelector(".input-getter input");
        const buttonVariable=document.querySelector(".input-getter button");
        const listContainer=document.querySelector(".list-container")
        buttonVariable.addEventListener("click",()=>{
                if(inputVariable.value.trim()===""){
                    alert("You must type your take....");
                }
                else{
                    let li=document.createElement("li");
                    li.textContent = inputVariable.value.trim();   
                    listContainer.appendChild(li); 
                    let span=document.createElement("span");
                    span.innerHTML="\u00d7"
                    li.appendChild(span);
                }
                inputVariable.value = "";
                saveData();

        });
        listContainer.addEventListener("click",(event)=>{
            if(event.target.tagName==="LI"){
                event.target.classList.toggle("checked");
                saveData();
            }
            else if(event.target.tagName==="SPAN"){
                event.target.parentElement.remove();
                saveData();
            }
        })
        function saveData(){
            localStorage.setItem("data",listContainer.innerHTML);
        }
        function showTask(){
            listContainer.innerHTML=localStorage.getItem("data");
        }
        showTask();
    </script>
</body>
</html>
